<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eaedf4" id="metaTheme">
<title>Sudoku</title>
<meta name="description" content="Судоку в браузере: восемнадцать режимов, четыре уровня, заметки и черновик, статистика. Без счетов и рекламы, работает офлайн.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sudoku">
<meta property="og:description" content="Судоку в браузере: восемнадцать режимов, четыре уровня, заметки и черновик, статистика. Без счетов и рекламы, работает офлайн.">
<meta property="og:url" content="https://yoonzky.github.io/sudoku/">
<meta property="og:image" content="https://yoonzky.github.io/sudoku/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:,">
<!-- the two faces the first screen is set in: without this the title and the
     figures are drawn by the system font and jump when the files arrive -->
<link rel="preload" as="font" type="font/woff2" href="fonts/tenor-sans-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/onest-cyrillic.woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/mobile.css">
<script>
/* the theme is set before the first paint; the colour comes from css, not a copy here */
(function(){
  try{
    var s=JSON.parse(localStorage.getItem('sudoku-ses')||'null');
    var t=s&&s.settings&&s.settings.theme;
    if(t!=='light'&&t!=='dark') return;
    document.documentElement.setAttribute('data-theme',t);
    var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    var m=document.getElementById('metaTheme');
    if(m&&bg) m.setAttribute('content',bg);
  }catch(e){}
})();
</script>
</head>
<body>
<header>
  <button class="iconbtn" id="backBtn">
    <svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
  </button>
  <h1>SUDOKU</h1>
  <p class="tagline" data-i18n="tagline"></p>
  <button class="iconbtn in-game-only" id="rulesBtn">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.9"/></svg>
  </button>
  <button class="iconbtn" id="statsBtn">
    <svg viewBox="0 0 24 24"><path d="M7.8 3.6h8.4v4.8a4.2 4.2 0 0 1-8.4 0Z"/><path d="M7.8 5.4H5.2v1.5a3.2 3.2 0 0 0 2.8 3.1"/><path d="M16.2 5.4h2.6v1.5a3.2 3.2 0 0 1-2.8 3.1"/><path d="M12 12.6v4.6M7.6 20.4h8.8M9.9 17.2h4.2v3.2"/></svg>
  </button>
  <button class="iconbtn" id="setBtn">
    <svg viewBox="0 0 24 24" style="stroke-linejoin:round; stroke-linecap:round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/></svg>
  </button>
</header>
<main>

  <section id="home">
    <div class="home-main">
      <div class="modes-col">
        <h2 class="hcap" data-i18n="modesT"></h2>
        <div id="modeList"></div>
        <div id="continueCard" style="display:none">
          <div class="hsec-head">
            <h2 class="hcap" data-i18n="continue"></h2>
            <button class="linkbtn" id="contPick" data-i18n="pickMany"></button>
            <div class="cont-bar hidden" id="contBar">
              <span id="contCount"></span>
              <button class="linkbtn" id="contAll" data-i18n="pickAll"></button>
              <button class="linkbtn" id="contNone" data-i18n="pickNone"></button>
              <button class="linkbtn danger" id="contDel" data-i18n="delSel"></button>
              <button class="linkbtn quiet" id="contCancel" data-i18n="pickCancel"></button>
            </div>
          </div>
          <div id="contList"></div>
        </div>
      </div>
      <aside class="mp" id="modePanel">
        <button class="sheet-grab" id="sheetGrab" data-i18n-label="sheetClose" aria-label="Свернуть панель"><i></i></button>
        <div class="mp-head">
          <div class="mp-prev" id="mpPrev"></div>
          <h3 id="mpName"></h3>
        </div>
        <p class="mode-tag" id="mpTag"></p>
        <h4 class="mp-rulecap" data-i18n="rulesT"></h4>
        <p id="mpRules"></p>
        <div class="mp-pool hidden" id="mpPool">
          <span id="poolCount"></span>
          <button id="poolOpen" data-i18n="poolBtn"></button>
        </div>
        <h4 data-i18n="lvlT"></h4>
        <div class="diff-grid" id="diffGrid"></div>
      </aside>
    </div>
    <div class="home-foot">
      <p class="tot">
        <b id="tot-won">0</b><span data-i18n="solvedL"></span>
        <b id="tot-perfect">0</b><span data-i18n="cleanL"></span>
        <b id="tot-time">—</b><span data-i18n="playtimeL"></span>
      </p>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <span class="t-item"><b id="gMode"></b><em id="gDiff"></em></span>
      <span class="t-item" id="gMistWrap"><span data-i18n="errorsL"></span>: <b id="gMist" aria-live="polite">0</b></span>
      <span class="t-item"><b id="gTimer">0:00</b></span>
      <button class="tbtn hidden" id="zoomBtn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="tbtn" id="restartBtnTop"><svg viewBox="0 0 24 24"><path d="M19.4 12a7.4 7.4 0 1 1-2.2-5.2" stroke-linecap="round"/><path d="M18.9 3.4v3.9H15" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tbtn-lbl" data-i18n="restart"></span>
      </button>
      <button class="tbtn" id="pauseBtn">
        <svg viewBox="0 0 24 24"><rect x="7.4" y="5.4" width="3.6" height="13.2" rx="1.8" fill="currentColor" stroke="none"/><rect x="13" y="5.4" width="3.6" height="13.2" rx="1.8" fill="currentColor" stroke="none"/></svg><span class="tbtn-lbl" data-i18n="pauseT"></span>
      </button>
    </div>
    <p class="mode-tag hidden" id="gameTag"></p>
    <p id="pickHint" class="hidden" data-i18n="pickHint"></p>
    <div class="board-wrap">
      <div class="board-pan" id="boardPan"><div id="board"></div></div>
      <div id="pauseOverlay" class="hidden">
        <p data-i18n="pausedT"></p>
        <small data-i18n="pauseTap"></small>
      </div>
      <div id="picker" class="hidden"></div>
    </div>
    <div class="controls">
      <div class="ctl-row" id="ctlModes">
        <button class="ctl" id="digitBtn"><svg viewBox="0 0 24 24"><path d="M9.6 8.4 13 5.9v12.2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 18.1h6.2" stroke-width="1.9" stroke-linecap="round"/></svg><span data-i18n="digitMode"></span></button>
        <button class="ctl" id="notesBtn"><svg viewBox="0 0 24 24"><circle cx="6.6" cy="6.6" r="2" fill="currentColor" stroke="none"/><circle cx="17.4" cy="6.6" r="2" fill="currentColor" stroke="none"/><circle cx="6.6" cy="17.4" r="2" fill="currentColor" stroke="none"/><circle cx="17.4" cy="17.4" r="2" fill="currentColor" stroke="none"/></svg><span data-i18n="notes"></span></button>
        <button class="ctl" id="midBtn"><svg viewBox="0 0 24 24"><circle cx="6.4" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="17.6" cy="12" r="2" fill="currentColor" stroke="none"/></svg><span data-i18n="mid"></span></button>
      </div>
      <div class="ctl-row" id="ctlActs">
        <button class="ctl" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10h-4"/><path d="M8 5 4 9l4 4"/></svg><span data-i18n="undo"></span></button>
        <button class="ctl" id="redoBtn"><svg viewBox="0 0 24 24"><path d="M20 9H9a5 5 0 0 0 0 10h4"/><path d="m16 5 4 4-4 4"/></svg><span data-i18n="redo"></span></button>
        <button class="ctl" id="eraseBtn"><svg viewBox="0 0 24 24"><path d="M9 20 3 14 13 4l6 6-10 10Z"/><path d="M21 20H9"/><path d="m7 10 6 6"/></svg><span data-i18n="erase"></span></button>
        <button class="ctl" id="autoNotesBtn"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><span data-i18n="auto"></span></button>
        <button class="ctl" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 19h6M10 22h4"/><path d="M12 3a6 6 0 0 1 4 10.5V16H8v-2.5A6 6 0 0 1 12 3Z"/></svg><span data-i18n="hint"></span></button>
      </div>
    </div>
    <div class="numpad" id="numpad"></div>
    <section id="winPanel" class="hidden">
      <div class="win-lead" data-i18n="winT"></div>
      <div class="win-head">
        <b class="win-big" id="winTime"></b>
        <div class="win-meta">
          <span class="record hidden" id="winRecord" data-i18n="newRecord"></span>
          <span class="win-sub" id="winSub"></span>
        </div>
      </div>
      <div class="win-foot">
        <div class="win-grid">
          <div id="winBestCell"><b id="winBest"></b><span id="winBestLbl" data-i18n="recordL"></span></div>
          <div id="winMistCell"><b id="winMist"></b><span data-i18n="mistakesL"></span></div>
          <div><b id="winHints"></b><span data-i18n="hintsL"></span></div>
        </div>
        <div class="win-act">
          <button class="btn ghost" id="winHome" data-i18n="menuBtn"></button>
          <button class="btn" id="winAgain" data-i18n="again"></button>
        </div>
      </div>
    </section>
  </section>

  <div id="sheetBg"></div>
</main>

<div class="modal-bg hidden" id="loseModal">
  <div class="modal" style="text-align:center">
    <h2 data-i18n="loseT"></h2>
    <p style="color:var(--muted); font-size:13px; font-weight:500; margin:6px 0 0" data-i18n="loseText"></p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="loseContinue" data-i18n="contNoLimit"></button>
      <button class="btn" id="loseNew" data-i18n="newGame"></button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="rulesModal">
  <div class="modal" style="max-width:520px">
    <h2 data-i18n="rulesT"></h2>
    <div class="rules-body">
      <div class="rules-prev" id="rulesPrev"></div>
      <div>
        <h3 id="rulesName" style="margin-top:0"></h3>
        <p class="mode-tag hidden" id="rulesTag"></p>
        <p id="rulesText"></p>
      </div>
    </div>
    <div class="row"><button class="btn" id="rulesClose" data-i18n="close"></button></div>
  </div>
</div>

<div class="modal-bg hidden" id="poolModal">
  <div class="modal">
    <h2 data-i18n="poolT"></h2>
    <div class="pool-grid" id="poolGrid"></div>
    <p class="pool-note" data-i18n="r_random"></p>
    <div class="row" style="justify-content:space-between">
      <span style="display:flex; gap:10px">
        <button class="btn quiet" id="poolAll" data-i18n="poolAll"></button>
        <button class="btn quiet" id="poolNone" data-i18n="poolNone"></button>
      </span>
      <button class="btn" id="poolClose" data-i18n="done"></button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="welcomeModal">
  <div class="modal" style="max-width:360px; text-align:center">
    <h2 data-i18n="welT"></h2>
    <div class="wel-grid">
      <button class="wel-card" id="welLight">
        <span class="wel-prev wp-light"><i></i><i class="a"></i><i></i><i></i></span>
        <b data-i18n="welLight"></b>
      </button>
      <button class="wel-card" id="welDark">
        <span class="wel-prev wp-dark"><i></i><i class="a"></i><i></i><i></i></span>
        <b data-i18n="welDark"></b>
      </button>
    </div>
    <p style="font-size:12px; color:var(--muted); margin:0" data-i18n="welNote"></p>
  </div>
</div>

<div class="modal-bg hidden" id="checkModal">
  <div class="modal" style="max-width:400px; text-align:center">
    <h2 data-i18n="checkT"></h2>
    <div class="wel-grid">
      <button class="wel-card" id="checkOn">
        <b data-i18n="checkOnT"></b>
        <span data-i18n="checkOnD"></span>
      </button>
      <button class="wel-card" id="checkOff">
        <b data-i18n="checkOffT"></b>
        <span data-i18n="checkOffD"></span>
      </button>
    </div>
    <p style="font-size:12px; color:var(--muted); margin:0" data-i18n="checkNote"></p>
  </div>
</div>

<div class="modal-bg hidden" id="confirmModal">
  <div class="modal" style="max-width:340px">
    <p id="confirmText" style="margin:4px 0 20px; font-size:14px; line-height:1.55"></p>
    <div class="row" style="justify-content:flex-end; gap:10px">
      <button class="btn ghost" id="confirmNo"></button>
      <button class="btn danger" id="confirmYes"></button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="statsModal">
  <div class="modal">
    <h2 data-i18n="stats"></h2>
    <table id="statsTable"></table>
    <table id="statsModes" class="t-modes"></table>
    <p class="note-line" data-i18n="cleanNote"></p>
    <div class="hist" id="histList"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn quiet" id="resetStats" data-i18n="reset"></button>
      <button class="btn" id="statsClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="setModal">
  <div class="modal">
    <h2 data-i18n="settings"></h2>
    <div class="set-body">
    <div class="stabs">
      <button data-tab="view" class="on" data-i18n="tabView"></button>
      <button data-tab="game" data-i18n="tabGame"></button>
      <button data-tab="keys" id="tabKeysBtn" data-i18n="tabKeys"></button>
    </div>
    <div class="stab-body">
    <div class="stab" id="tab-view">
      <div class="scols">
      <h3 data-i18n="themeT"></h3>
      <div class="swatches" id="swatches"></div>
      <h3 data-i18n="langT"></h3>
      <div class="langseg" id="langseg">
        <button data-l="en">English</button>
        <button data-l="ru">Русский</button>
      </div>
      </div>
    </div>
    <div class="stab hidden" id="tab-game">
      <div class="scols">
      <section class="sgrp">
        <h3 data-i18n="grpMist"></h3>
        <label class="toggle"><input type="checkbox" id="optInstant">
          <div><b data-i18n="instantT"></b><span data-i18n="instantD"></span></div></label>
        <label class="toggle"><input type="checkbox" id="optLimit">
          <div><b data-i18n="limitT"></b><span data-i18n="limitD"></span></div></label>
      </section>
      <section class="sgrp">
        <h3 data-i18n="grpInput"></h3>
        <label class="toggle only-fine" id="optDblRow"><input type="checkbox" id="optDbl">
          <div><b data-i18n="pickerT"></b><span data-i18n="pickerD"></span></div></label>
        <label class="toggle"><input type="checkbox" id="optDigitFirst">
          <div><b data-i18n="digitFirstT"></b><span data-i18n="digitFirstD"></span></div></label>
      </section>
      <section class="sgrp">
        <h3 data-i18n="grpBoard"></h3>
        <label class="toggle"><input type="checkbox" id="optPeers">
          <div><b data-i18n="peersT"></b><span data-i18n="peersD"></span></div></label>
        <label class="toggle"><input type="checkbox" id="optSame">
          <div><b data-i18n="sameT"></b><span data-i18n="sameD"></span></div></label>
        <label class="toggle"><input type="checkbox" id="optCounts">
          <div><b data-i18n="countsT"></b><span data-i18n="countsD"></span></div></label>
      </section>
      <section class="sgrp">
        <h3 data-i18n="grpBtns"></h3>
        <label class="toggle"><input type="checkbox" id="optHintBtn">
          <div><b data-i18n="hintBtnT"></b><span data-i18n="hintBtnD"></span></div></label>
        <label class="toggle"><input type="checkbox" id="optAutoBtn">
          <div><b data-i18n="autoBtnT"></b><span data-i18n="autoBtnD"></span></div></label>
      </section>
      </div>
    </div>
    <div class="stab hidden" id="tab-keys">
      <div class="keys">
        <section class="kgrp">
          <h3 data-i18n="grpKinput"></h3>
          <div class="krow"><span data-i18n="k_digit"></span><span class="kk"><kbd>1</kbd><i class="sep">–</i><kbd>9</kbd></span></div>
          <div class="krow"><span data-i18n="k_big"></span><span class="kk"><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd></span></div>
          <div class="krow"><span data-i18n="k_note"></span><span class="kk"><kbd>Shift</kbd><i class="sep">+</i><kbd>1</kbd><i class="sep">–</i><kbd>9</kbd></span></div>
          <div class="krow"><span data-i18n="k_mid"></span><span class="kk"><kbd class="kmod"></kbd><i class="sep">+</i><kbd>1</kbd><i class="sep">–</i><kbd>9</kbd></span></div>
          <div class="krow"><span data-i18n="k_erase"></span><span class="kk"><kbd>Backspace</kbd><i class="sep" data-i18n="kOr"></i><kbd>0</kbd></span></div>
        </section>
        <section class="kgrp">
          <h3 data-i18n="grpKmode"></h3>
          <div class="krow"><span data-i18n="k_modeDigit"></span><span class="kk"><kbd>Z</kbd></span></div>
          <div class="krow"><span data-i18n="k_modeNote"></span><span class="kk"><kbd>X</kbd></span></div>
          <div class="krow"><span data-i18n="k_modeMid"></span><i class="knote" data-i18n="kNot12"></i><span class="kk"><kbd>C</kbd></span></div>
          <div class="krow"><span data-i18n="k_modeNext"></span><span class="kk"><kbd data-i18n="k_spaceK"></kbd></span></div>
          <div class="krow"><span data-i18n="k_pick"></span><span class="kk gest" data-i18n="k_gest"></span></div>
          <div class="krow"><span data-i18n="k_multi"></span><span class="kk gest" data-i18n="k_multiG"></span></div>
          <div class="krow"><span data-i18n="k_multiAdd"></span><span class="kk"><kbd class="kmod"></kbd><i class="sep">+</i><span class="gest" data-i18n="k_click"></span></span></div>
        </section>
        <section class="kgrp">
          <h3 data-i18n="grpKmove"></h3>
          <div class="krow"><span data-i18n="k_undo"></span><span class="kk"><kbd class="kmod"></kbd><i class="sep">+</i><kbd>Z</kbd></span></div>
          <div class="krow"><span data-i18n="k_redo"></span><span class="kk"><kbd class="kmod"></kbd><i class="sep">+</i><kbd>Y</kbd></span></div>
          <div class="krow" id="krowHint"><span data-i18n="k_hint"></span><i class="kwhen" data-i18n="kNeedsBtn"></i><span class="kk"><kbd>H</kbd></span></div>
          <div class="krow" id="krowAuto"><span data-i18n="k_auto"></span><i class="knote" data-i18n="kNot9"></i><i class="kwhen" data-i18n="kNeedsBtn"></i><span class="kk"><kbd>A</kbd></span></div>
        </section>
        <section class="kgrp">
          <h3 data-i18n="grpKgame"></h3>
          <div class="krow"><span data-i18n="k_nav"></span><span class="kk"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span></div>
          <div class="krow"><span data-i18n="k_rules"></span><span class="kk"><kbd>R</kbd></span></div>
          <div class="krow"><span data-i18n="k_pause"></span><span class="kk"><kbd>P</kbd></span></div>
          <div class="krow"><span data-i18n="k_menu"></span><span class="kk"><kbd>Esc</kbd></span></div>
        </section>
      </div>
    </div>
    </div>
    </div>
    <div class="row"><button class="btn" id="setClose" data-i18n="done"></button></div>
  </div>
</div>

<div id="genOverlay" class="hidden"></div>

<script src="js/engine/grade.js"></script>
